name: Material Bank Transport 003

on:
  pull_request:
    paths:
      - 'tools/material_bank_batch_003.py'
      - 'material-bank-transport-003/**'

permissions:
  contents: read

jobs:
  build-material-bank-003:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build batch 003
        run: python tools/material_bank_batch_003.py --out material-bank-batch-003
      - name: Show sizes
        run: |
          du -sh material-bank-batch-003/payload/* || true
          find material-bank-batch-003/transport -maxdepth 1 -type f -printf '%f %s\n' | sort
          find material-bank-batch-003/payload -type f | wc -l

      # One Drive-safe part per Actions artifact. GitHub's artifact ZIP is then <100 MB.
      - name: Upload learning noncommercial 000
        uses: actions/upload-artifact@v4
        with: {name: mb003-learning-nc-000, path: material-bank-batch-003/transport/learning_noncommercial.part-000, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload learning open 000
        uses: actions/upload-artifact@v4
        with: {name: mb003-learning-open-000, path: material-bank-batch-003/transport/learning_open.part-000, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload learning open 001
        uses: actions/upload-artifact@v4
        with: {name: mb003-learning-open-001, path: material-bank-batch-003/transport/learning_open.part-001, compression-level: 0, retention-days: 2, if-no-files-found: error}

      - name: Upload rendering 000
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-000, path: material-bank-batch-003/transport/rendering_vfx.part-000, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 001
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-001, path: material-bank-batch-003/transport/rendering_vfx.part-001, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 002
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-002, path: material-bank-batch-003/transport/rendering_vfx.part-002, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 003
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-003, path: material-bank-batch-003/transport/rendering_vfx.part-003, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 004
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-004, path: material-bank-batch-003/transport/rendering_vfx.part-004, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 005
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-005, path: material-bank-batch-003/transport/rendering_vfx.part-005, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 006
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-006, path: material-bank-batch-003/transport/rendering_vfx.part-006, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 007
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-007, path: material-bank-batch-003/transport/rendering_vfx.part-007, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload rendering 008
        uses: actions/upload-artifact@v4
        with: {name: mb003-rendering-008, path: material-bank-batch-003/transport/rendering_vfx.part-008, compression-level: 0, retention-days: 2, if-no-files-found: error}

      - name: Upload procedural 000
        uses: actions/upload-artifact@v4
        with: {name: mb003-procedural-000, path: material-bank-batch-003/transport/procedural_ai_motion.part-000, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload procedural 001
        uses: actions/upload-artifact@v4
        with: {name: mb003-procedural-001, path: material-bank-batch-003/transport/procedural_ai_motion.part-001, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload procedural 002
        uses: actions/upload-artifact@v4
        with: {name: mb003-procedural-002, path: material-bank-batch-003/transport/procedural_ai_motion.part-002, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload procedural 003
        uses: actions/upload-artifact@v4
        with: {name: mb003-procedural-003, path: material-bank-batch-003/transport/procedural_ai_motion.part-003, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload procedural 004
        uses: actions/upload-artifact@v4
        with: {name: mb003-procedural-004, path: material-bank-batch-003/transport/procedural_ai_motion.part-004, compression-level: 0, retention-days: 2, if-no-files-found: error}

      - name: Upload catalog 000
        uses: actions/upload-artifact@v4
        with: {name: mb003-catalog-000, path: material-bank-batch-003/transport/catalog_only.part-000, compression-level: 0, retention-days: 2, if-no-files-found: error}
      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: mb003-manifests
          path: |
            material-bank-batch-003/transport/ORIGINAL_SHA256SUMS
            material-bank-batch-003/transport/SHA256SUMS
            material-bank-batch-003/transport/REASSEMBLY.md
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
